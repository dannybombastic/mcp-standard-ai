[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-context-manager-mcp"
version = "0.1.0"
description = "AI Context Manager MCP - Sync agent for AI assets (skills, prompts, specs, context)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Danny Bombastic", email = "contact@example.com" }
]
keywords = ["mcp", "ai", "context", "sync", "cloud", "assets", "skills", "prompts", "specs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "filelock>=3.13.0",
]

[project.urls]
Homepage = "https://github.com/dannybombastic/mcp-standard-ai"
Documentation = "https://github.com/dannybombastic/mcp-standard-ai#readme"
Repository = "https://github.com/dannybombastic/mcp-standard-ai.git"
Issues = "https://github.com/dannybombastic/mcp-standard-ai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
ai-context-manager = "mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
